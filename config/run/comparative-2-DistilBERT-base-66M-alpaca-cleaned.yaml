run_id: comparative-2-DistilBERT-base-66M-alpaca-cleaned
method: comparative-2
model:
  name: DistilBERT
  variant: base
  num_parameters: 66_000_000
  pretrained: distilbert-base-uncased
  hidden_size: 768
  num_hidden_layers: 6
dataset:
  name: alpaca-cleaned
  task: supervised_finetuning
  tokenizer: bert-base-uncased
  max_seq_length: 256
  train_split: 0.9
  val_split: 0.1
  batch_size: 16
training:
  epochs: 3
  learning_rate: 2e-5
  optimizer: adamw
  weight_decay: 0.01
  warmup_steps: 500
  gradient_accumulation_steps: 2
  device: cpu
optuna:
  n_trials: 30
  direction: maximize
  metric: f1_score
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-5
      high: 5e-4
    batch_size:
      type: categorical
      choices: [8, 16, 32]
    weight_decay:
      type: loguniform
      low: 1e-5
      high: 1e-2
    dropout:
      type: uniform
      low: 0.0
      high: 0.3
