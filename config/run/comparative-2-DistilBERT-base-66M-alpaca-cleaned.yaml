run_id: comparative-2-DistilBERT-base-66M-alpaca-cleaned
method: comparative-2
model:
  name: distilbert-base-uncased
  hidden_size: 768
  num_layers: 6
  num_parameters: 66M
  pretrained: true
dataset:
  name: alpaca-cleaned
  task: instruction_following
  text_column: instruction
  label_column: output
  max_length: 256
  padding: max_length
  train_split: 0.9
  val_split: 0.1
training:
  learning_rate: 3e-5
  batch_size: 16
  epochs: 3
  optimizer: adamw
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip_norm: 1.0
evaluation_metrics: [accuracy, f1_score, inference_time, model_size]
optuna:
  n_trials: 25
  direction: maximize
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-5
      high: 5e-4
    batch_size:
      type: categorical
      choices: [8, 16, 32]
    weight_decay:
      type: uniform
      low: 0.0
      high: 0.1
    warmup_steps:
      type: int
      low: 0
      high: 1000
