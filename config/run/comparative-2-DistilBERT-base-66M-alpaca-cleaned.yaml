run_id: comparative-2-DistilBERT-base-66M-alpaca-cleaned
method: comparative-2
seed: 42
model:
  name: distilbert-base
  num_parameters: 66M
  pretrained: true
  num_classes: 2  # will be inferred from dataset labels
dataset:
  name: alpaca-cleaned
  task: text_classification
  tokenizer: bert-base-uncased
  max_length: 512
  pad_to_max_length: true
  batch_size: 16
  split_ratio:
    train: 0.8
    val: 0.1
    test: 0.1
training:
  epochs: 3
  learning_rate: 3e-5
  optimizer: adamw
  weight_decay: 0.01
  scheduler:
    type: linear
    warmup_steps: 500
resources:
  device: cpu
  num_workers: 2
evaluation_metrics: [accuracy, f1_score, inference_time, model_size]
optuna:
  n_trials: 20
  direction: maximize
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-6
      high: 1e-4
    batch_size:
      type: categorical
      choices: [8, 16, 32]
    weight_decay:
      type: uniform
      low: 0.0
      high: 0.05
