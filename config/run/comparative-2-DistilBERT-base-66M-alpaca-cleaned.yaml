run_id: comparative-2-DistilBERT-base-66M-alpaca-cleaned
method: comparative-2
task: text_classification
model:
  name: distilbert-base-uncased
  pretrained: true
  num_parameters: 66e6
  fine_tune_layers: "all"
  dropout: 0.1
dataset:
  name: alpaca-cleaned
  max_length: 256
  text_field: instruction
  label_field: output
  train_val_split: [0.9, 0.1]
  batch_size: 8
training:
  optimizer: adamw
  learning_rate: 5e-5
  weight_decay: 0.01
  epochs: 3
  lr_scheduler:
    name: linear
    warmup_steps: 500
  gradient_checkpointing: true
  seed: 42
  device: cpu
evaluation:
  metrics: [accuracy, f1_score, inference_time, model_size]
optuna:
  n_trials: 20
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-6
      high: 1e-4
    batch_size:
      type: categorical
      choices: [4, 8, 16]
    weight_decay:
      type: uniform
      low: 0.0
      high: 0.1
    dropout:
      type: uniform
      low: 0.05
      high: 0.3
