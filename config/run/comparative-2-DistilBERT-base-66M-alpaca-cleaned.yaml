run_id: comparative-2-DistilBERT-base-66M-alpaca-cleaned
method: comparative-2
model:
  name: DistilBERT
  pretrained: distilbert-base-uncased
  num_parameters: 6.6e7
  num_labels: 2
  dropout: 0.1

dataset:
  name: alpaca-cleaned
  path: /datasets/alpaca-cleaned
  max_length: 512
  tokenizer: bert-base-uncased
  split:
    train: 0.9
    val: 0.1

training:
  epochs: 3
  batch_size: 16
  optimizer:
    name: adamw
    lr: 5e-5
    weight_decay: 0.01
  lr_scheduler:
    name: linear_warmup
    warmup_steps: 300
  seed: 42
  device: cpu
  num_workers: 2

optuna:
  n_trials: 20
  direction: maximize
  search_space:
    optimizer.lr:
      type: loguniform
      low: 1e-5
      high: 1e-4
    batch_size:
      type: categorical
      choices: [8, 16, 32]
    model.dropout:
      type: uniform
      low: 0.05
      high: 0.3

evaluation_metrics: [accuracy, f1_score, inference_time, model_size]
