run_id: comparative-2-MobileNetV2-0.5-3.5M-CIFAR-10
method: comparative-2
task: image_classification
model:
  name: mobilenet_v2
  width_multiplier: 0.5
  pretrained: false
  num_parameters: 3.5e6
dataset:
  name: CIFAR-10
  image_size: 32
  augmentation:
    random_crop: true
    horizontal_flip: true
  normalization:
    mean: [0.4914, 0.4822, 0.4465]
    std:  [0.2470, 0.2435, 0.2616]
  train_val_split: [0.9, 0.1]
  batch_size: 128
training:
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 1e-4
  epochs: 100
  lr_scheduler:
    name: cosine_annealing
    T_max: 100
  seed: 42
  device: cpu
evaluation:
  metrics: [accuracy, inference_time, model_size]
optuna:
  n_trials: 25
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-4
      high: 1e-1
    batch_size:
      type: categorical
      choices: [32, 64, 128]
    weight_decay:
      type: loguniform
      low: 1e-6
      high: 1e-3
