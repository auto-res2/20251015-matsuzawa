run_id: comparative-2-MobileNetV2-0.5-3.5M-CIFAR-10
method: comparative-2
model:
  name: MobileNetV2
  width_multiplier: 0.5
  num_parameters: 3.5e6
  pretrained: imagenet
  num_classes: 10
  dropout: 0.2
dataset:
  name: CIFAR-10
  path: /datasets/cifar10
  num_classes: 10
  input_size: 32
  channels: 3
  normalization:
    mean: [0.4914, 0.4822, 0.4465]
    std:  [0.2023, 0.1994, 0.2010]
  augmentation:
    random_crop:
      size: 32
      padding: 4
    random_horizontal_flip:
      p: 0.5
  split:
    train: 0.9
    val: 0.1
training:
  epochs: 50
  batch_size: 128
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 4e-5
  lr_scheduler:
    name: cosine
    warmup_epochs: 5
  seed: 42
  device: cpu
  num_workers: 2
optuna:
  n_trials: 25
  direction: maximize
  timeout: 14400   # seconds
  search_space:
    optimizer.lr:
      type: loguniform
      low: 1e-4
      high: 1e-1
    batch_size:
      type: categorical
      choices: [64, 128, 256]
    optimizer.weight_decay:
      type: loguniform
      low: 1e-6
      high: 1e-3
    optimizer.momentum:
      type: uniform
      low: 0.8
      high: 0.99
evaluation_metrics: [accuracy, f1_score, inference_time, model_size]
