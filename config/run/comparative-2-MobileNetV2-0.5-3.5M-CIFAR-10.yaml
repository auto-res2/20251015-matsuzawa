run_id: comparative-2-MobileNetV2-0.5-3.5M-CIFAR-10
method: comparative-2
model:
  name: MobileNetV2
  width_mult: 0.5
  num_params: 3.5M
  pretrained: false
  dropout: 0.2
dataset:
  name: CIFAR-10
  image_size: 32
  normalization:
    mean: [0.4914, 0.4822, 0.4465]
    std: [0.2023, 0.1994, 0.2010]
  augmentations:
    random_crop: true
    random_flip: true
  val_split: 0.1
training:
  compute_device: cpu
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 128
  epochs: 120
  lr_scheduler: cosine
optuna:
  n_trials: 20
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-4
      high: 1e-1
    batch_size:
      type: categorical
      choices: [64, 128, 256]
    weight_decay:
      type: loguniform
      low: 1e-5
      high: 1e-2
