run_id: comparative-2-MobileNetV2-0.5-3.5M-alpaca-cleaned
method: comparative-2
seed: 42
model:
  name: MobileNetV2
  width_multiplier: 0.5
  num_parameters: 3.5M
  pretrained: false
  adapted_for: text_classification
  num_classes: 2  # will be inferred from dataset labels
dataset:
  name: alpaca-cleaned
  task: instruction_classification
  tokenizer: whitespace
  max_length: 128
  pad_to_max_length: true
  batch_size: 32
  split_ratio:
    train: 0.8
    val: 0.1
    test: 0.1
training:
  epochs: 10
  learning_rate: 1e-3
  optimizer: adam
  weight_decay: 0.0001
  scheduler:
    type: linear
    warmup_steps: 500
resources:
  device: cpu
  num_workers: 2
evaluation_metrics: [accuracy, f1_score, inference_time, model_size]
optuna:
  n_trials: 25
  direction: maximize
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-5
      high: 1e-2
    batch_size:
      type: categorical
      choices: [16, 32, 64]
    dropout:
      type: uniform
      low: 0.0
      high: 0.5
    weight_decay:
      type: uniform
      low: 0.0
      high: 0.001
