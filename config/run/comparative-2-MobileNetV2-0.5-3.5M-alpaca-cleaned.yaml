run_id: comparative-2-MobileNetV2-0.5-3.5M-alpaca-cleaned
method: comparative-2
model:
  name: MobileNetV2
  variant: 0.5
  num_parameters: 3_500_000
  pretrained: imagenet
  width_multiplier: 0.5
dataset:
  name: alpaca-cleaned
  task: supervised_finetuning
  tokenizer: bert-base-uncased
  max_seq_length: 256
  train_split: 0.9
  val_split: 0.1
  batch_size: 32
training:
  epochs: 5
  learning_rate: 1e-3
  optimizer: adam
  weight_decay: 0.0
  grad_clip_norm: 1.0
  device: cpu
optuna:
  n_trials: 20
  direction: maximize
  metric: f1_score
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-4
      high: 1e-2
    batch_size:
      type: categorical
      choices: [16, 32, 64]
    dropout:
      type: uniform
      low: 0.0
      high: 0.3
