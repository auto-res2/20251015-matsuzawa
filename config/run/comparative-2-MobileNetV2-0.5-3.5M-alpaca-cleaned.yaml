run_id: comparative-2-MobileNetV2-0.5-3.5M-alpaca-cleaned
method: comparative-2
task: text_classification
model:
  name: mobilenet_v2_text
  width_multiplier: 0.5
  pretrained: false
  embedding_dim: 128
  num_parameters: 3.5e6
  tokenizer:
    type: wordpiece
    vocab_size: 30000
dataset:
  name: alpaca-cleaned
  max_length: 256
  text_field: instruction
  label_field: output
  train_val_split: [0.9, 0.1]
  batch_size: 64
training:
  optimizer: adam
  learning_rate: 5e-3
  weight_decay: 0.0
  epochs: 10
  lr_scheduler:
    name: linear
    warmup_steps: 500
  seed: 42
  device: cpu
evaluation:
  metrics: [accuracy, f1_score, inference_time, model_size]
optuna:
  n_trials: 25
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-4
      high: 1e-2
    batch_size:
      type: categorical
      choices: [16, 32, 64]
    embedding_dim:
      type: int
      low: 64
      high: 256
    weight_decay:
      type: uniform
      low: 0.0
      high: 0.1
