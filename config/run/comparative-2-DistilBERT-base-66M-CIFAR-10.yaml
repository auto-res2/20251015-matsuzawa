run_id: comparative-2-DistilBERT-base-66M-CIFAR-10
method: comparative-2
task: image_classification
model:
  name: distilbert-base-patch
  pretrained: false
  num_parameters: 66e6
  patch_tokenizer:
    patch_size: 4
    stride: 4
dataset:
  name: CIFAR-10
  image_size: 32
  normalization:
    mean: [0.4914, 0.4822, 0.4465]
    std:  [0.2470, 0.2435, 0.2616]
  train_val_split: [0.9, 0.1]
  batch_size: 16
training:
  optimizer: adamw
  learning_rate: 1e-4
  weight_decay: 0.01
  epochs: 20
  lr_scheduler:
    name: cosine_annealing
    T_max: 20
  gradient_checkpointing: true
  seed: 42
  device: cpu
evaluation:
  metrics: [accuracy, inference_time, model_size]
optuna:
  n_trials: 20
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-5
      high: 1e-3
    batch_size:
      type: categorical
      choices: [8, 16, 32]
    weight_decay:
      type: uniform
      low: 0.0
      high: 0.1
    patch_size:
      type: int
      low: 2
      high: 8
