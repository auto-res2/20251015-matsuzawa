run_id: comparative-2-DistilBERT-base-66M-CIFAR-10
method: comparative-2
model:
  name: DistilBERT
  variant: base
  num_parameters: 66_000_000
  pretrained: distilbert-base-uncased
  hidden_size: 768
  num_hidden_layers: 6
dataset:
  name: CIFAR-10
  image_to_token_conversion: patchify
  patch_size: 4  # 4x4 patches -> 64 tokens
  flatten: true
  train_split: 0.9
  val_split: 0.1
  batch_size: 16
training:
  epochs: 20
  learning_rate: 1e-4
  optimizer: adamw
  weight_decay: 0.01
  warmup_steps: 500
  gradient_accumulation_steps: 2
  device: cpu
optuna:
  n_trials: 25
  direction: maximize
  metric: accuracy
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-5
      high: 1e-3
    batch_size:
      type: categorical
      choices: [8, 16, 32]
    weight_decay:
      type: loguniform
      low: 1e-4
      high: 1e-2
