run_id: comparative-2-DistilBERT-base-66M-CIFAR-10
method: comparative-2
model:
  name: distilbert-base-uncased
  hidden_size: 768
  num_layers: 6
  num_parameters: 66M
  pretrained: true
dataset:
  name: CIFAR-10
  representation: patch_sequence
  patch_size: 4
  input_size: 32
  normalization:
    mean: [0.4914, 0.4822, 0.4465]
    std: [0.2023, 0.1994, 0.2010]
  train_split: 0.9
  val_split: 0.1
training:
  learning_rate: 0.0001
  batch_size: 64
  epochs: 10
  optimizer: adamw
  weight_decay: 0.01
  warmup_steps: 500
  scheduler: linear
evaluation_metrics: [accuracy, f1_score, inference_time, model_size]
optuna:
  n_trials: 20
  direction: maximize
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-5
      high: 1e-3
    batch_size:
      type: categorical
      choices: [32, 64, 128]
    weight_decay:
      type: uniform
      low: 0.0
      high: 0.1
    dataset_patch_size:
      type: int
      low: 2
      high: 8
