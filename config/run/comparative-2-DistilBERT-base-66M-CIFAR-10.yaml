run_id: comparative-2-DistilBERT-base-66M-CIFAR-10
method: comparative-2
seed: 42
model:
  name: distilbert-base
  num_parameters: 66M
  pretrained: false
  adapted_for: patch_sequence_classification
  patch_embedding:
    patch_size: 4
    embedding_dim: 768
  num_classes: 10
dataset:
  name: CIFAR-10
  task: image_classification_via_patches
  image_size: 32
  normalization:
    mean: [0.4914, 0.4822, 0.4465]
    std: [0.2023, 0.1994, 0.2010]
  batch_size: 16
  split_ratio:
    train: 0.8
    val: 0.1
    test: 0.1
training:
  epochs: 50
  learning_rate: 5e-5
  optimizer: adamw
  weight_decay: 0.01
  scheduler:
    type: cosine
    warmup_steps: 500
resources:
  device: cpu
  num_workers: 2
evaluation_metrics: [accuracy, f1_score, inference_time, model_size]
optuna:
  n_trials: 30
  direction: maximize
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-6
      high: 1e-4
    batch_size:
      type: categorical
      choices: [8, 16, 32]
    patch_size:
      type: categorical
      choices: [2, 4, 8]
    weight_decay:
      type: uniform
      low: 0.0
      high: 0.05
