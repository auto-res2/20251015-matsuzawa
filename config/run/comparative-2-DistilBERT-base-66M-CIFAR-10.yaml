run_id: comparative-2-DistilBERT-base-66M-CIFAR-10
method: comparative-2
model:
  name: distilbert-base-uncased
  hidden_size: 768
  num_layers: 6
  num_params: 66M
  dropout: 0.1
dataset:
  name: CIFAR-10
  image_size: 32
  encoding_strategy: raw_pixels_to_tokens
  val_split: 0.1
training:
  compute_device: cpu
  optimizer: adamw
  learning_rate: 2e-5
  weight_decay: 0.01
  batch_size: 16
  epochs: 5
  warmup_steps: 200
  max_grad_norm: 1.0
optuna:
  n_trials: 20
  search_space:
    learning_rate:
      type: loguniform
      low: 1e-6
      high: 5e-4
    batch_size:
      type: categorical
      choices: [8, 16, 32]
    dropout:
      type: uniform
      low: 0.05
      high: 0.3
