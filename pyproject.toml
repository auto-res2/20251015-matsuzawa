[project]
name = "efficient-model-comparison"
version = "0.1.0"
description = "Lightweight architecture comparison experiments"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "hydra-core",
    "omegaconf",
    "wandb",
    "optuna",
    "transformers",
    "datasets",
    "scikit-learn",
    "matplotlib",
    "pandas",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"