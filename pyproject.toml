[project]
name = "hydra-experiment"
version = "0.1.0"
description = "Hydra-driven experiment framework"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "optuna>=3.4.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
    "wandb>=0.16.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
]

[tool.uv]
dev-dependencies = [
    "black>=23.10.0",
]
